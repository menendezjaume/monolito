<main class="main">
  <div class="centered-column-container">

      <mat-card *ngFor="let post of posts" class="spacing-16" appearance="outlined">
        <mat-card-header>
          <img mat-card-avatar [src]="post.image_url" [alt]="post.username">
          <mat-card-title>{{ post.username }}</mat-card-title>
          <!-- <mat-card-subtitle>Dog Breed</mat-card-subtitle> -->
        </mat-card-header>
        <img mat-card-image [src]="post.image_url" [alt]="post.content">

        <mat-card-actions>
          <button matButton>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="local_fire_department"></mat-icon>
          </button>
          <button matButton>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="mail"></mat-icon>
          </button>
        </mat-card-actions>
        <mat-card-content>
            <p><strong>{{ post.username }}</strong>: {{ post.content }}</p>
        </mat-card-content>
      </mat-card>

    </div>
</main>


<router-outlet />
